<svg viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:inherit"><line x1="60" y1="150" x2="900" y2="150" stroke="var(--gold)" stroke-width="1.2" opacity="0.5"/><circle cx="60" cy="150" r="5" fill="var(--gold)"/><text x="60" y="128" font-size="13" fill="var(--gold)" text-anchor="middle">第 0 天</text><text x="60" y="182" font-size="11" fill="var(--tx2)" text-anchor="middle">15 分鐘：入廟→上香→第一次拿</text><text x="60" y="198" font-size="11" fill="var(--tx2)" text-anchor="middle">到緣塵</text><text x="60" y="230" font-size="10.5" fill="var(--warn)" text-anchor="middle">不入廟就沒事做</text><circle cx="215" cy="150" r="5" fill="var(--gold)"/><text x="215" y="128" font-size="13" fill="var(--gold)" text-anchor="middle">第 1 天</text><text x="215" y="182" font-size="11" fill="var(--tx2)" text-anchor="middle">探望 +8／日帽／天燈的第一個願</text><text x="215" y="230" font-size="10.5" fill="var(--warn)" text-anchor="middle">沒有回訪理由</text><circle cx="370" cy="150" r="5" fill="var(--gold)"/><text x="370" y="128" font-size="13" fill="var(--gold)" text-anchor="middle">第 7 天</text><text x="370" y="182" font-size="11" fill="var(--tx2)" text-anchor="middle">伴靈一階／顯化一階（7 天或 7</text><text x="370" y="198" font-size="11" fill="var(--tx2)" text-anchor="middle"> 筆）</text><text x="370" y="230" font-size="10.5" fill="var(--warn)" text-anchor="middle">習慣沒形成</text><circle cx="525" cy="150" r="5" fill="var(--gold)"/><text x="525" y="128" font-size="13" fill="var(--gold)" text-anchor="middle">第 30 天</text><text x="525" y="182" font-size="11" fill="var(--tx2)" text-anchor="middle">伴靈成形／被記得 30／親密度印</text><text x="525" y="198" font-size="11" fill="var(--tx2)" text-anchor="middle">章</text><text x="525" y="230" font-size="10.5" fill="var(--warn)" text-anchor="middle">關係沒建立</text><circle cx="680" cy="150" r="5" fill="var(--gold)"/><text x="680" y="128" font-size="13" fill="var(--gold)" text-anchor="middle">節慶</text><text x="680" y="182" font-size="11" fill="var(--tx2)" text-anchor="middle">遶境·頭香·中元（年度高點）</text><text x="680" y="230" font-size="10.5" fill="var(--warn)" text-anchor="middle">一年只有幾次高峰</text><circle cx="835" cy="150" r="5" fill="var(--gold)"/><text x="835" y="128" font-size="13" fill="var(--gold)" text-anchor="middle">一年後</text><text x="835" y="182" font-size="11" fill="var(--tx2)" text-anchor="middle">牌位周年／還願／第二本經</text><text x="835" y="230" font-size="10.5" fill="var(--warn)" text-anchor="middle">沒有下一個目標</text><text x="60" y="270" font-size="11.5" fill="var(--tx2)">黃字＝時間軸上的流失風險點（F19-07 要處理的洞）</text></svg>